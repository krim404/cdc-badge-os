stages:
  - build
  - release
  - deploy

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PLATFORMIO_CORE_DIR: "$CI_PROJECT_DIR/.cache/platformio"

default:
  image: python:3.14
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .cache/pip
      - .cache/platformio

.pio_setup:
  before_script:
    - python -m pip install --upgrade pip
    - pip install platformio

build:
  stage: build
  extends: .pio_setup
  script:
    - pio test -e native
    - pio run
    - pip install construct
    - export IDF_PATH="$(find "$PLATFORMIO_CORE_DIR/packages" -maxdepth 1 -name 'framework-espidf*' | head -1)"
    - python tools/build_lang_image.py --lang-dir assets/i18n --output build/plugins_initial.bin
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="$CI_COMMIT_TAG"
      else
        VERSION="$CI_COMMIT_SHORT_SHA"
      fi
      echo "Building version: $VERSION"
      echo "VERSION=$VERSION" >> build.env
      mkdir -p artifacts
      cp .pio/build/cdc_badge_usb/firmware.bin    "artifacts/cdc-badge-firmware-${VERSION}.bin"
      cp .pio/build/cdc_badge_usb/bootloader.bin  "artifacts/cdc-badge-bootloader-${VERSION}.bin"
      cp .pio/build/cdc_badge_usb/partitions.bin  "artifacts/cdc-badge-partitions-${VERSION}.bin"
      cp build/plugins_initial.bin                "artifacts/cdc-badge-plugins-initial-${VERSION}.bin"
  artifacts:
    name: "cdc-badge-firmware-$CI_COMMIT_REF_SLUG"
    paths:
      - artifacts/
    reports:
      dotenv: build.env
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|master|release|develop)$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

release:
  stage: release
  image: curlimages/curl:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - |
      set -e
      base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
      art="${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/artifacts"
      auth="JOB-TOKEN: ${CI_JOB_TOKEN}"
      payload=$(cat <<JSON
      {
        "name": "${CI_COMMIT_TAG}",
        "tag_name": "${CI_COMMIT_TAG}",
        "description": "CDC Badge OS ${CI_COMMIT_TAG}",
        "assets": {
          "links": [
            { "name": "cdc-badge-firmware-${CI_COMMIT_TAG}.bin", "url": "${art}/cdc-badge-firmware-${CI_COMMIT_TAG}.bin?job=build", "link_type": "package" },
            { "name": "cdc-badge-bootloader-${CI_COMMIT_TAG}.bin", "url": "${art}/cdc-badge-bootloader-${CI_COMMIT_TAG}.bin?job=build", "link_type": "package" },
            { "name": "cdc-badge-partitions-${CI_COMMIT_TAG}.bin", "url": "${art}/cdc-badge-partitions-${CI_COMMIT_TAG}.bin?job=build", "link_type": "package" },
            { "name": "cdc-badge-plugins-initial-${CI_COMMIT_TAG}.bin", "url": "${art}/cdc-badge-plugins-initial-${CI_COMMIT_TAG}.bin?job=build", "link_type": "package" }
          ]
        }
      }
      JSON
      )
      code=$(curl -sS -o /tmp/rel.json -w "%{http_code}" --request POST --header "$auth" --header "Content-Type: application/json" --data "$payload" "$base")
      echo "create release -> HTTP $code"
      if [ "$code" = "409" ]; then
        echo "release exists, updating metadata"
        curl -sS --fail --request PUT --header "$auth" --header "Content-Type: application/json" \
          --data "{\"name\":\"${CI_COMMIT_TAG}\",\"description\":\"CDC Badge OS ${CI_COMMIT_TAG}\"}" \
          "$base/${CI_COMMIT_TAG}" > /dev/null
      elif [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
        cat /tmp/rel.json
        exit 1
      fi

pages:
  stage: deploy
  image: node:22
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - |
      set -e
      DOXYGEN_VERSION="1.16.1"
      ARC="/tmp/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
      for URL in \
        "https://www.doxygen.nl/files/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz" \
        "https://downloads.sourceforge.net/project/doxygen/rel-${DOXYGEN_VERSION}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"; do
        echo "Downloading ${URL}"
        if curl --fail --location --retry 3 --retry-delay 5 --output "$ARC" "$URL"; then break; fi
      done
      test -s "$ARC"
      rm -rf "/opt/doxygen-${DOXYGEN_VERSION}"
      mkdir -p "/opt/doxygen-${DOXYGEN_VERSION}"
      tar -xzf "$ARC" -C "/opt/doxygen-${DOXYGEN_VERSION}" --strip-components=1
      ln -sf "/opt/doxygen-${DOXYGEN_VERSION}/bin/doxygen" /usr/local/bin/doxygen
      doxygen --version
    - doxygen Doxyfile
    - npm --prefix website ci
    - SITE_BASE=/cdc-badge-os/ npm --prefix website run build
    - SITE_BASE=/cdc-badge-os/ npm --prefix website run check:links
    - mkdir -p public
    - cp -r website/dist/. public/
    - mkdir -p public/api
    - cp -r doxygen_output/html/* public/api/
    - mkdir -p public/flasher
    - cp web-flasher/index.html public/flasher/
    - if [ -f web-flasher/badge.jpg ]; then cp web-flasher/badge.jpg public/flasher/; fi
    - cp "artifacts/cdc-badge-bootloader-${CI_COMMIT_TAG}.bin"      public/flasher/bootloader.bin
    - cp "artifacts/cdc-badge-partitions-${CI_COMMIT_TAG}.bin"      public/flasher/partitions.bin
    - cp "artifacts/cdc-badge-firmware-${CI_COMMIT_TAG}.bin"        public/flasher/firmware.bin
    - cp "artifacts/cdc-badge-plugins-initial-${CI_COMMIT_TAG}.bin" public/flasher/plugins_initial.bin
    - |
      cat > public/flasher/manifest.json <<MANIFEST
      {
        "name": "CDC Badge OS (Firmware Update)",
        "version": "${CI_COMMIT_TAG}",
        "new_install_prompt_erase": true,
        "builds": [
          {
            "chipFamily": "ESP32-S3",
            "parts": [
              { "path": "bootloader.bin", "offset": 0 },
              { "path": "partitions.bin", "offset": 32768 },
              { "path": "firmware.bin", "offset": 327680 }
            ]
          }
        ]
      }
      MANIFEST
    - |
      cat > public/flasher/manifest_factory.json <<MANIFEST
      {
        "name": "CDC Badge OS (Factory Setup)",
        "version": "${CI_COMMIT_TAG}",
        "builds": [
          {
            "chipFamily": "ESP32-S3",
            "parts": [
              { "path": "bootloader.bin",      "offset": 0 },
              { "path": "partitions.bin",      "offset": 32768 },
              { "path": "firmware.bin",        "offset": 327680 },
              { "path": "plugins_initial.bin", "offset": 14614528 }
            ]
          }
        ]
      }
      MANIFEST
  artifacts:
    paths:
      - public
