name: Deploy Codeberg Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: codeberg-medium

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run

      - name: Build initial plugins FAT image
        run: |
          pip install construct
          python tools/build_lang_image.py \
            --lang-dir assets/i18n \
            --output build/plugins_initial.bin

      - name: Install Doxygen 1.16.1
        run: |
          set -euo pipefail
          DOXYGEN_VERSION="1.16.1"
          DOXYGEN_ARCHIVE="/tmp/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          for URL in \
            "https://www.doxygen.nl/files/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz" \
            "https://downloads.sourceforge.net/project/doxygen/rel-${DOXYGEN_VERSION}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          do
            echo "Downloading ${URL}"
            if curl --fail --location --retry 3 --retry-delay 5 --output "${DOXYGEN_ARCHIVE}" "${URL}"; then
              break
            fi
          done
          test -s "${DOXYGEN_ARCHIVE}"
          tar -tzf "${DOXYGEN_ARCHIVE}" > /dev/null
          sudo rm -rf /opt/doxygen-1.16.1
          sudo mkdir -p /opt/doxygen-1.16.1
          sudo tar -xzf "${DOXYGEN_ARCHIVE}" -C /opt/doxygen-1.16.1 --strip-components=1
          sudo ln -sf /opt/doxygen-1.16.1/bin/doxygen /usr/local/bin/doxygen

      - name: Build Doxygen documentation
        run: doxygen Doxyfile

      - name: Resolve version tag
        id: version
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          VERSION="${GIT_REF#refs/tags/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Assemble pages content
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p _site/docs
          cp web-flasher/index.html _site/
          if [ -f web-flasher/badge.jpg ]; then cp web-flasher/badge.jpg _site/; fi
          cp -r doxygen_output/html/* _site/docs/

          cp .pio/build/cdc_badge_usb/bootloader.bin _site/bootloader.bin
          cp .pio/build/cdc_badge_usb/partitions.bin _site/partitions.bin
          cp .pio/build/cdc_badge_usb/firmware.bin   _site/firmware.bin
          cp build/plugins_initial.bin               _site/plugins_initial.bin

          cat > _site/manifest.json <<MANIFEST
          {
            "name": "CDC Badge OS (Firmware Update)",
            "version": "${TAG}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "bootloader.bin", "offset": 0 },
                  { "path": "partitions.bin", "offset": 32768 },
                  { "path": "firmware.bin", "offset": 327680 }
                ]
              }
            ]
          }
          MANIFEST

          cat > _site/manifest_factory.json <<MANIFEST
          {
            "name": "CDC Badge OS (Factory Setup)",
            "version": "${TAG}",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "bootloader.bin",      "offset": 0 },
                  { "path": "partitions.bin",      "offset": 32768 },
                  { "path": "firmware.bin",        "offset": 327680 },
                  { "path": "plugins_initial.bin", "offset": 14614528 }
                ]
              }
            ]
          }
          MANIFEST

      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: 'https://${{ forge.repository_owner }}.codeberg.page/cdc-badge-os/'
          token: ${{ forge.token }}
          source: _site/
