name: Build Firmware

on:
  push:
    branches: [main, master, release, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master, release]
  workflow_dispatch:

jobs:
  test:
    runs-on: codeberg-small

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run host unit tests
        run: pio test -e native

  build:
    runs-on: codeberg-medium

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Restore PlatformIO cache
        id: pio-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Download platform, framework and toolchain
        run: pio pkg install -e cdc_badge_usb

      - name: Save PlatformIO cache
        if: steps.pio-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Build firmware
        run: pio run

      - name: Build initial plugins FAT image
        run: |
          pip install construct
          python tools/build_lang_image.py \
            --lang-dir assets/i18n \
            --output build/plugins_initial.bin

      - name: Get version info
        id: version
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          if [[ "$GIT_REF" == refs/tags/* ]]; then
            VERSION="${GIT_REF#refs/tags/}"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Rename firmware artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts
          cp .pio/build/cdc_badge_usb/firmware.bin    "artifacts/cdc-badge-firmware-${VERSION}.bin"
          cp .pio/build/cdc_badge_usb/bootloader.bin  "artifacts/cdc-badge-bootloader-${VERSION}.bin"
          cp .pio/build/cdc_badge_usb/partitions.bin  "artifacts/cdc-badge-partitions-${VERSION}.bin"
          cp build/plugins_initial.bin                "artifacts/cdc-badge-plugins-initial-${VERSION}.bin"

      - name: Upload firmware artifacts
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: cdc-badge-firmware-${{ steps.version.outputs.version }}
          path: artifacts/
          retention-days: 90

      - name: Create Codeberg release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ forge.token }}
          TAG: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          RID=$(curl -sS -H "Authorization: token $TOKEN" \
            "$SERVER/api/v1/repos/$REPO/releases/tags/$TAG" | jq -r '.id // empty')
          if [ -z "$RID" ]; then
            RID=$(curl -fsS -X POST \
              -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"draft\":false,\"prerelease\":false}" \
              "$SERVER/api/v1/repos/$REPO/releases" | jq -r '.id')
          fi
          for f in artifacts/*; do
            curl -fsS -X POST \
              -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "$SERVER/api/v1/repos/$REPO/releases/$RID/assets?name=$(basename "$f")"
          done
