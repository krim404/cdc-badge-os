name: Deploy GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run

      - name: Build initial plugins FAT image
        run: |
          pip install construct
          python tools/build_lang_image.py \
            --lang-dir assets/i18n \
            --output build/plugins_initial.bin

      - name: Install Doxygen 1.16.1
        run: |
          set -euo pipefail
          DOXYGEN_VERSION="1.16.1"
          DOXYGEN_ARCHIVE="/tmp/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          for URL in \
            "https://www.doxygen.nl/files/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz" \
            "https://downloads.sourceforge.net/project/doxygen/rel-${DOXYGEN_VERSION}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          do
            echo "Downloading ${URL}"
            if curl --fail --location --retry 3 --retry-delay 5 --output "${DOXYGEN_ARCHIVE}" "${URL}"; then
              break
            fi
          done
          test -s "${DOXYGEN_ARCHIVE}"
          tar -tzf "${DOXYGEN_ARCHIVE}" > /dev/null
          sudo rm -rf /opt/doxygen-1.16.1
          sudo mkdir -p /opt/doxygen-1.16.1
          sudo tar -xzf "${DOXYGEN_ARCHIVE}" -C /opt/doxygen-1.16.1 --strip-components=1
          sudo ln -sf /opt/doxygen-1.16.1/bin/doxygen /usr/local/bin/doxygen

      - name: Build Doxygen documentation
        run: doxygen Doxyfile

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build documentation site
        run: |
          npm --prefix website ci
          SITE_BASE=/cdc-badge-os/ SITE_URL=https://krim404.github.io npm --prefix website run build
          SITE_BASE=/cdc-badge-os/ npm --prefix website run check:links

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$GIT_REF" == refs/tags/* ]]; then
            VERSION="${GIT_REF#refs/tags/}"
          else
            VERSION="$(gh release view --repo "$REPO" --json tagName -q .tagName 2>/dev/null || echo dev)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Assemble site
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Documentation site (Astro Starlight) at the root
          mkdir -p _site
          cp -r website/dist/. _site/
          # Doxygen code reference under /api/
          mkdir -p _site/api
          cp -r doxygen_output/html/* _site/api/
          # Web flasher + firmware binaries + manifests under /flasher/
          mkdir -p _site/flasher
          cp web-flasher/index.html _site/flasher/
          if [ -f web-flasher/badge.jpg ]; then cp web-flasher/badge.jpg _site/flasher/; fi
          cp .pio/build/cdc_badge_usb/bootloader.bin _site/flasher/bootloader.bin
          cp .pio/build/cdc_badge_usb/partitions.bin _site/flasher/partitions.bin
          cp .pio/build/cdc_badge_usb/firmware.bin   _site/flasher/firmware.bin
          cp build/plugins_initial.bin               _site/flasher/plugins_initial.bin

          cat > _site/flasher/manifest.json << MANIFEST
          {
            "name": "CDC Badge OS (Firmware Update)",
            "version": "${TAG}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "bootloader.bin", "offset": 0 },
                  { "path": "partitions.bin", "offset": 32768 },
                  { "path": "firmware.bin", "offset": 327680 }
                ]
              }
            ]
          }
          MANIFEST

          cat > _site/flasher/manifest_factory.json << MANIFEST
          {
            "name": "CDC Badge OS (Factory Setup)",
            "version": "${TAG}",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "bootloader.bin",      "offset": 0 },
                  { "path": "partitions.bin",      "offset": 32768 },
                  { "path": "firmware.bin",        "offset": 327680 },
                  { "path": "plugins_initial.bin", "offset": 14614528 }
                ]
              }
            ]
          }
          MANIFEST

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Delete stale github-pages artifacts from prior attempts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of artifacts.data.artifacts) {
              if (artifact.name === 'github-pages') {
                core.info(`Deleting stale artifact ${artifact.id} from prior attempt`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
